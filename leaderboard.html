<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排行榜 · Synthwave Runner</title>
<style>
:root{color-scheme:dark;--bg:#0b0420;--card:#1a0b33;--pink:#ff3cae;--cyan:#3cdcff;--gold:#ffd24a;--mut:#8a7bb5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#0b0420,#3a0f5e 60%,#b0307f);color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;padding:20px 14px}
main{max-width:560px;margin:0 auto}
h1{text-align:center;color:var(--cyan);text-shadow:0 0 12px var(--cyan);margin:6px 0 4px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
a.btn,button{background:transparent;color:var(--cyan);border:1.5px solid var(--cyan);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
button.del{color:var(--pink);border-color:var(--pink)}
button:active,a.btn:active{opacity:.6}
.list{background:var(--card);border:1px solid #4b2a7a;border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #2c1650}
.row:last-child{border:0}
.rk{color:var(--pink);font-weight:bold}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{color:var(--gold);font-size:12px}
.act{display:flex;gap:6px;grid-column:2/4;justify-content:flex-end}
.act button{padding:4px 10px;font-size:12px}
#msg{text-align:center;color:var(--mut);padding:16px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>🏆 排行榜</h1>
  <div class="sub">資料來自 Google Sheets · 可改名 / 刪除</div>
  <div class="bar"><a class="btn" href="index.html">← 回遊戲</a><button id="rf">重新整理</button></div>
  <div class="list" id="list"><div id="msg">載入中…</div></div>
</main>
<script src="config.js"></script>
<script>
const list = document.getElementById('list');

function note(t){ list.textContent=''; const d=document.createElement('div'); d.id='msg'; d.textContent=t; list.appendChild(d); }

async function load(){                       // Read
  note('載入中…');
  try{
    const r = await api('list',{limit:50});
    if(!r.ok) throw new Error(r.error);
    if(!r.data.length) return note('還沒有任何成績,去玩一場吧!');
    list.textContent='';
    r.data.forEach((d,i)=>{
      const row=document.createElement('div'); row.className='row';
      const rk=document.createElement('div'); rk.className='rk'; rk.textContent='#'+(i+1);
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=d.name;
      const sc=document.createElement('div'); sc.className='sc'; sc.textContent=d.score+' 分 · ●'+d.coins;
      const act=document.createElement('div'); act.className='act';
      const b1=document.createElement('button'); b1.textContent='改名'; b1.onclick=()=>rename(d);
      const b2=document.createElement('button'); b2.textContent='刪除'; b2.className='del'; b2.onclick=()=>remove(d);
      act.append(b1,b2); row.append(rk,nm,sc,act); list.appendChild(row);
    });
  }catch(e){ note('載入失敗:'+e.message); }
}

async function rename(d){                    // Update
  const name = prompt('新的暱稱(最多 12 字)', d.name);
  if(name===null || !name.trim()) return;
  try{ const r=await api('update',{id:d.id,name}); if(!r.ok) throw new Error(r.error); load(); }
  catch(e){ alert('修改失敗:'+e.message); }
}

async function remove(d){                    // Delete
  if(!confirm('確定刪除「'+d.name+'」的成績?')) return;
  try{ const r=await api('delete',{id:d.id}); if(!r.ok) throw new Error(r.error); load(); }
  catch(e){ alert('刪除失敗:'+e.message); }
}

document.getElementById('rf').onclick = load;
load();
</script>
</body>
</html>
